# Sveltia CMS configuration for Opus's personal site
# Docs: https://sveltiacms.app
#
# Local editing:  npm run dev  ->  http://localhost:4321/admin/index.html
#                 (Chromium browser, click "Work with Local Repository",
#                  select the project root D:\000projects\mywebsite)
# Remote editing: https://opus39tjy-netizen.github.io/admin/
#                 (sign in with a GitHub personal access token)
#
# 媒体按板块分开存放：每个集合有自己的 media_folder。

backend:
  name: github
  repo: opus39tjy-netizen/opus39tjy-netizen.github.io
  branch: main

site_url: https://opus39tjy-netizen.github.io
display_url: https://opus39tjy-netizen.github.io

# 顶层媒体目录：站点级素材（如首页背景图）
media_folder: /public/images
public_folder: /images

media_libraries:
  default:
    config:
      slugify_filename: true
      max_file_size: 26214400 # 25 MB, keeps the Git repo small

collections:
  - name: course
    label: 课程
    label_singular: 一门课程
    folder: src/content/course
    create: true
    format: yaml-frontmatter
    identifier_field: title
    media_folder: /public/course/images
    public_folder: /course/images
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: description, label: 描述, widget: text, required: false }
      - { name: date, label: 日期, widget: hidden, default: '{{datetime}}' }
      - { name: category, label: 分类, widget: string, default: 课程 }
      - { name: order, label: 排序, widget: number, required: false, value_type: int }
      - { name: cover, label: 封面图, widget: image, required: false }
      - name: files
        label: 课程文件（可多选：PDF、PPT、图片等）
        widget: file
        multiple: true
        required: false
        media_folder: /public/course/files
        public_folder: /course/files
      - { name: tags, label: 标签, widget: list, required: false, default: [] }
      - { name: body, label: 正文（可插入图片）, widget: markdown }

  - name: writing
    label: 文章
    label_singular: 一篇文章
    folder: src/content/writing
    create: true
    format: yaml-frontmatter
    identifier_field: title
    media_folder: /public/writing/images
    public_folder: /writing/images
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: description, label: 摘要, widget: text, required: false }
      - { name: date, label: 日期, widget: hidden, default: '{{datetime}}' }
      - { name: category, label: 分类, widget: string, default: 随笔 }
      - { name: tags, label: 标签, widget: list, required: false, default: [] }
      - { name: cover, label: 封面图, widget: image, required: false }
      - { name: url, label: 外部链接, widget: string, required: false }
      - { name: draft, label: 草稿（不显示）, widget: boolean, default: false, required: false }
      - { name: body, label: 正文, widget: markdown }

  - name: music
    label: 音乐
    label_singular: 一条音乐
    folder: src/content/music
    create: true
    format: yaml-frontmatter
    identifier_field: title
    media_folder: /public/music/images
    public_folder: /music/images
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: description, label: 描述, widget: text, required: false }
      - { name: date, label: 日期, widget: hidden, default: '{{datetime}}' }
      - { name: category, label: 分类, widget: string, default: 创作 }
      - { name: artist, label: 艺人, widget: string, required: false }
      - name: audio
        label: 音频文件（MP3 / WAV）
        widget: file
        required: false
        media_folder: /public/music/audio
        public_folder: /music/audio
      - { name: url, label: 外部收听链接, widget: string, required: false }
      - { name: cover, label: 封面图, widget: image, required: false }
      - { name: tags, label: 标签, widget: list, required: false, default: [] }
      - name: links
        label: 外部链接列表
        widget: list
        required: false
        default: []
        fields:
          - { name: label, label: 名称, widget: string }
          - { name: href, label: 链接, widget: string }
      - name: video
        label: 视频（小文件，可选）
        widget: file
        required: false
        media_folder: /public/music/videos
        public_folder: /music/videos
      - { name: draft, label: 草稿（不显示）, widget: boolean, default: false, required: false }
      - { name: body, label: 正文, widget: markdown }

  - name: comments
    label: 评论设置
    files:
      - name: giscus
        label: Giscus 评论
        file: src/data/giscus.json
        fields:
          - { name: repo, label: 仓库（owner/repo）, widget: string }
          - { name: repoId, label: 仓库 ID（repo-id）, widget: string, required: false }
          - { name: category, label: 分类名称, widget: string, default: Announcements }
          - { name: categoryId, label: 分类 ID（category-id）, widget: string, required: false }

  - name: settings
    label: 站点设置
    files:
      - name: site
        label: 站点信息
        file: src/data/site.json
        fields:
          - { name: name, label: 名字 / 标识, widget: string }
          - { name: heading, label: 首页大标题, widget: string }
          - { name: title, label: 浏览器标题, widget: string }
          - { name: tagline, label: 首页小字（可留空）, widget: string, required: false }
          - { name: description, label: 网站描述, widget: text }
          - { name: heroImage, label: 首页背景图, widget: image, required: false }
          - name: socials
            label: 社交链接（圆钮）
            widget: list
            required: false
            default: []
            fields:
              - { name: label, label: 名称, widget: string }
              - { name: href, label: 链接, widget: string }

  - name: pages
    label: 页面
    files:
      - name: about
        label: 关于页
        file: src/content/pages/about.md
        fields:
          - { name: title, label: 标题, widget: string, default: 关于 }
          - { name: eyebrow, label: 小标签, widget: string, required: false, default: 关于 }
          - { name: description, label: 描述, widget: text, required: false }
          - { name: body, label: 正文, widget: markdown }
